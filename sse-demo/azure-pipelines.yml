# Example Azure DevOps pipeline: Terraform -> images -> Helm.
# Needs an Azure Resource Manager service connection (variable azureServiceConnection)
# with rights to create resources and role assignments in the subscription.

trigger:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'sse-demo-azure'   # name of your service connection
  subscriptionId: '00000000-0000-0000-0000-000000000000'
  imageTag: '$(Build.BuildId)'

stages:
  # 1. Infrastructure: AKS, ACR, Azure Managed Redis, Key Vault.
  - stage: Infra
    jobs:
      - job: Terraform
        steps:
          - task: AzureCLI@2
            name: tf
            displayName: terraform apply
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              workingDirectory: infra
              inlineScript: |
                set -euo pipefail
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(subscriptionId)"
                terraform init -input=false
                terraform apply -input=false -auto-approve -var "subscription_id=$(subscriptionId)"
                # Hand the outputs to the next stages.
                for out in resource_group aks_name acr_login_server key_vault_name redis_secret_name; do
                  echo "##vso[task.setvariable variable=$out;isOutput=true]$(terraform output -raw $out)"
                done

  # 2. Container images, pushed to ACR.
  - stage: Build
    dependsOn: Infra
    variables:
      acr: $[ stageDependencies.Infra.Terraform.outputs['tf.acr_login_server'] ]
    jobs:
      - job: Images
        steps:
          - task: UseDotNet@2
            inputs:
              version: 10.0.x
          - task: AzureCLI@2
            displayName: Build and push images
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "$(acr)"
                # .NET services: the SDK builds the image itself, no Dockerfile needed.
                dotnet publish backend/SseDemo.Api.csproj -c Release -t:PublishContainer \
                  -p:ContainerRegistry=$(acr) -p:ContainerRepository=sse-demo/api -p:ContainerImageTag=$(imageTag)
                dotnet publish worker/SseDemo.Worker.csproj -c Release -t:PublishContainer \
                  -p:ContainerRegistry=$(acr) -p:ContainerRepository=sse-demo/worker -p:ContainerImageTag=$(imageTag)
                # Angular: built and served by nginx (frontend/Dockerfile).
                docker build -t $(acr)/sse-demo/frontend:$(imageTag) frontend
                docker push $(acr)/sse-demo/frontend:$(imageTag)

  # 3. Deploy the Helm chart generated by `aspire publish` (k8s/).
  - stage: Deploy
    dependsOn: [Infra, Build]
    variables:
      acr: $[ stageDependencies.Infra.Terraform.outputs['tf.acr_login_server'] ]
      resourceGroup: $[ stageDependencies.Infra.Terraform.outputs['tf.resource_group'] ]
      aksName: $[ stageDependencies.Infra.Terraform.outputs['tf.aks_name'] ]
      keyVault: $[ stageDependencies.Infra.Terraform.outputs['tf.key_vault_name'] ]
    jobs:
      - job: Helm
        steps:
          # Reads the secret "redis-connection-string" into the variable $(redis-connection-string).
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVault)
              SecretsFilter: redis-connection-string
          - task: HelmInstaller@1
          - task: AzureCLI@2
            displayName: helm upgrade --install
            env:
              REDIS_CONNECTION_STRING: $(redis-connection-string)
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials --resource-group "$(resourceGroup)" --name "$(aksName)" --overwrite-existing
                # The connection string contains commas, which `helm --set` would split,
                # so the secret goes in through a values file that never leaves the agent.
                cat > secrets.values.yaml <<YAML
                secrets:
                  api:
                    redis: "${REDIS_CONNECTION_STRING}"
                  worker:
                    redis: "${REDIS_CONNECTION_STRING}"
                YAML
                helm upgrade --install sse-demo k8s \
                  --namespace sse-demo --create-namespace \
                  -f secrets.values.yaml \
                  --set parameters.api.api_image=$(acr)/sse-demo/api:$(imageTag) \
                  --set parameters.worker.worker_image=$(acr)/sse-demo/worker:$(imageTag) \
                  --set parameters.frontend.frontend_image=$(acr)/sse-demo/frontend:$(imageTag) \
                  --wait
                rm secrets.values.yaml
                kubectl get ingress web -n sse-demo

---
apiVersion: "v1"
kind: "Secret"
metadata:
  name: "worker-secrets"
  labels:
    app.kubernetes.io/name: "{{ .Chart.Name }}"
    app.kubernetes.io/component: "worker"
    app.kubernetes.io/instance: "{{ .Release.Name }}"
stringData:
  ConnectionStrings__redis: {{ tpl "{{ .Values.secrets.worker.redis }}" . | quote }}
type: "Opaque"
